<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joe Zhuo's projects and experience, charted as a crystal constellation." />
    <meta name="theme-color" content="#000000" />
    <title>Joe Zhuo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&family=Playfair+Display:wght@400&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="dust" aria-hidden="true"></canvas>

    <header id="top">
      <div class="nav-start">
        <button id="home" class="mono ghost" data-hover aria-label="Back to title page">Joe Zhuo</button>
        <nav id="sections" aria-label="Portfolio">
          <a href="#about" data-hover>About</a>
          <a href="#llm-inference-engine" data-hover>Projects</a>
          <a href="#team-3150a" data-hover>Experience</a>
        </nav>
      </div>
      <div class="top-actions">
        <a class="icon-btn" href="/resume.pdf" target="_blank" rel="noopener" aria-label="Résumé" title="Résumé" data-hover>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <path d="M4.5 2h7l4 4v12h-11zM11.5 2v4h4M7 10h6M7 13h5"/>
          </svg>
        </a>
        <a class="icon-btn" href="https://github.com/joezhuo2" target="_blank" rel="noopener" aria-label="GitHub profile" title="GitHub" data-hover>
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
        </a>
        <a class="icon-btn" href="https://www.linkedin.com/in/joe-zhuo" target="_blank" rel="noopener" aria-label="LinkedIn profile" title="LinkedIn" data-hover>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
          </svg>
        </a>
        <button id="sound" class="icon-btn" data-hover aria-pressed="true" aria-label="Sound" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3l4.5-3.5v12L7 14.5H4z" />
            <path class="wave" pathLength="1" d="M15 9.5a3.5 3.5 0 0 1 0 5" />
            <path class="wave" pathLength="1" d="M17.5 7a7 7 0 0 1 0 10" />
            <path class="cross" pathLength="1" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </header>

    <main id="title" class="screen" hidden>
      <h1>Joe Zhuo</h1>
      <div class="lede">
        <p class="mono" id="intro-label">Computer engineering · Waterloo</p>
        <p id="intro-description">I build GPU inference engines and systems software. Choose a section above for a guided tour, or select a star to explore my work.</p>
      </div>
      <div class="title-start">
        <button id="begin" class="cta" data-hover><span>Explore constellation</span></button>
      </div>
    </main>

    <div id="hud" hidden>
      <nav id="index" aria-label="Stars"></nav>
      <div id="card" role="tooltip" aria-hidden="true">
        <p class="mono card-kind"></p>
        <p class="card-title"></p>
        <p class="card-tag"></p>
        <p class="mono card-cta"></p>
      </div>
      <div id="hint">
        <span class="hint-line" aria-hidden="true"></span>
        <p class="mono" aria-live="polite"><span id="hint-text"></span></p>
        <button id="fly" class="mono ghost" data-hover>Zoom to the stars</button>
      </div>
    </div>

    <aside id="panel" role="dialog" aria-labelledby="panel-title" hidden>
      <div id="panel-spot" aria-hidden="true"></div>
      <header>
        <div class="panel-top">
          <p class="mono" id="panel-kind"></p>
          <button id="panel-close" class="mono ghost" data-hover aria-label="Close panel">Close ✕</button>
        </div>
        <h2 id="panel-title" tabindex="-1"></h2>
        <p class="mono dim" id="panel-meta"></p>
        <ul id="panel-links"></ul>
      </header>
      <div id="panel-body"></div>
      <footer>
        <button id="prev" class="mono ghost" data-hover>← Previous</button>
        <span class="mono dim" id="panel-count"></span>
        <button id="next" class="mono ghost" data-hover>Next →</button>
      </footer>
    </aside>

    <svg class="defs" width="0" height="0" aria-hidden="true">
      <filter id="lens-panel" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage x="0" y="0" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="64" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="lens-card" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage x="0" y="0" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="44" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div class="cursor" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
